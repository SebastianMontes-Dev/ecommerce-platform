# Perfil de despliegue. La imagen Docker arranca con SPRING_PROFILES_ACTIVE=prod.
# Todo lo sensible o específico del entorno llega por variable de entorno (ver .env.example).
spring:
  jpa:
    show-sql: false
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Recicla conexiones periódicamente para evitar que un firewall/load balancer
      # intermedio las corte a mitad de uso sin que el pool se entere.
      max-lifetime: 1800000        # 30 min
      # Detecta (loguea) una conexión que un caller no devolvió al pool en ese tiempo —
      # típicamente una transacción que quedó abierta más de lo esperado.
      leak-detection-threshold: 60000   # 60 s
      connection-timeout: 30000    # 30 s (default de Hikari, explícito por claridad)
      data-source-properties:
        # Corta a nivel de sesión JDBC una query que se cuelga, para que no consuma
        # una conexión del pool indefinidamente.
        options: "-c statement_timeout=30000 -c lock_timeout=10000"

logging:
  # Logs en JSON (Elastic Common Schema), una línea por evento, listos para ELK/Loki.
  # El MDC (traceId, spanId, tenantId, userId) se incluye automáticamente en cada objeto.
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.ecommerce: INFO
    org.hibernate.SQL: WARN

server:
  # 'native' (RemoteIpValve de Tomcat), no 'framework': solo así request.getRemoteAddr() se
  # resuelve de forma segura a partir de X-Forwarded-For. RemoteIpValve únicamente confía en
  # ese header cuando la conexión TCP entra desde un proxy en 'internal-proxies' (rangos
  # privados por defecto: 10.x, 172.16-31.x, 192.168.x, loopback) -si no viene de ahí, ignora
  # el header y usa la IP real del socket-. Con 'framework' (ForwardedHeaderFilter) el header
  # se usa para reescribir host/scheme/URL pero NO remoteAddr, así que InterceptorLimiteTasa
  # seguía expuesto a que cualquier cliente falsee su propia IP y resetee su cubo de rate limit.
  forward-headers-strategy: native
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
