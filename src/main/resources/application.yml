spring:
  application:
    name: ecommerce-platform
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce_db
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      # Flyway es la única fuente de verdad del esquema. 'validate' evita que Hibernate
      # modifique tablas por su cuenta (el drift que 'update' introdujo obligó a las
      # migraciones correctivas V12-V14). El perfil 'test' ya usaba 'validate'.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          # Sin ESTA entrada, SecurityConfig.oauth2Login() no encuentra un bean
          # ClientRegistrationRepository y la app entera no arranca (falla la construcción
          # del SecurityFilterChain), aunque nadie use el login social. El placeholder no
          # puede ir vacío: Boot valida "client-id must not be empty" al construir el
          # registro, así que sin GOOGLE_CLIENT_ID definido cae en este valor de relleno
          # -arranca igual- y solo falla, en el proveedor y no acá, si alguien entra a
          # /oauth2/authorization/google sin credenciales reales configuradas.
          google:
            client-id: ${GOOGLE_CLIENT_ID:sin-configurar}
            client-secret: ${GOOGLE_CLIENT_SECRET:sin-configurar}
            scope: email,profile

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: PLATFORM_ADMIN
      probes:
        enabled: true          # habilita /actuator/health/{liveness,readiness} para k8s/Docker
      group:
        # readiness: no aceptar tráfico si la DB o Redis (carrito) no responden
        readiness:
          include: readinessState,db,redis
        # liveness: solo el estado del contexto; un blip de infra no debe reiniciar el pod
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  # traceId/spanId los inyecta Micrometer Tracing; FiltroMdc añade tenantId/userId.
  # En consola (dev) se ven en este bloque; en prod salen como campos del JSON estructurado.
  pattern:
    correlation: "[trace=%X{traceId:-} tienda=%X{tenantId:-} user=%X{userId:-}] "
  include-application-name: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  oauth2:
    # A dónde redirige ManejadorExitoAutenticacionOAuth2/ManejadorFalloAutenticacionOAuth2
    # tras el login social, llevando el JWT en el fragmento de la URL (#access_token=...).
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  outbox:
    intervalo-ms: ${OUTBOX_INTERVALO_MS:5000}   # cada cuánto corre el worker
    lote: 50                                     # filas por tick
    max-intentos: 10                             # tras esto -> FALLIDO (requiere intervención)
    minutos-colgado: 2                           # PROCESANDO más viejo que esto se re-reclama
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ecommerce-images}
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  elasticsearch:
    host: ${ES_HOST:localhost}
    port: ${ES_PORT:9200}

resilience4j:
  circuitbreaker:
    instances:
      pagos:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      correos:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
        ignoreExceptions:
          - com.ecommerce.modulos.compartido.domain.ExcepcionEntidadNoEncontrada